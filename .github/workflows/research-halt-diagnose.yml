# Explain an EngineHalt of a research run: decrypt the snapshot and the (unfinished) run directory of the failed research-run, re-run the finishing stage
# with a probe on the optimizer (tools/halt_diagnose.py) and print the solver attempts and constraint violations as aggregates. Changes nothing and uploads nothing.
name: research-halt-diagnose

on:
  workflow_dispatch:
    inputs:
      data_run_id:
        description: "run id of the research-data workflow whose encrypted snapshot the run used"
        required: true
      failed_run_id:
        description: "run id of the research-run workflow that halted (its finished-<run_id> artifact is used)"
        required: true
      run_id:
        description: "research run id (lineage name)"
        required: true
        default: "real4"

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SNAPSHOT_PASSPHRASE: ${{ secrets.SNAPSHOT_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12.15"
      - name: Install from the lock
        run: |
          python -m pip install --upgrade pip uv
          if [ ! -f uv.lock ]; then cp uv.lock.candidate uv.lock; fi
          uv sync --frozen --extra dev
      - name: Get and decrypt the snapshot and the run directory
        run: |
          test -n "$SNAPSHOT_PASSPHRASE" || { echo "::error::repository secret SNAPSHOT_PASSPHRASE is not set"; exit 1; }
          gh run download "${{ inputs.data_run_id }}" -n research-snapshot -D dl
          mkdir -p data/snapshots/research outputs/runs
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SNAPSHOT_PASSPHRASE -in dl/snapshot.tar.gz.enc | tar -xzf - -C data/snapshots/research
          ID=$(ls data/snapshots/research | grep -E '^[0-9a-f]{64}$' | head -1)
          ln -sfn "$ID" data/snapshots/research/current
          gh run download "${{ inputs.failed_run_id }}" -n "finished-${{ inputs.run_id }}" -D fin
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SNAPSHOT_PASSPHRASE -in fin/finished.tar.gz.enc | tar -xzf - -C outputs/runs
      - name: Re-run the finishing stage with the optimizer probe
        run: |
          uv run python tools/halt_diagnose.py --run-id "${{ inputs.run_id }}" --out-root outputs/runs --config configs/research_8_12asset.yaml 2>&1 | grep -v "^Model is not converging" | tail -n 120 || true
