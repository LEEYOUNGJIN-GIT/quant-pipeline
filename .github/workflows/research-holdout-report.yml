# Read the result of an OPENED run (artifact opened-<run_id>, written by research-holdout): verify it from its files and print the aggregate holdout
# figures. The artifact is encrypted, so this is the only way to read it; the log carries no prices, weights or per-date values.
name: research-holdout-report

on:
  workflow_dispatch:
    inputs:
      opened_run_id:
        description: "run id of the research-holdout workflow that opened the run"
        required: true
      run_id:
        description: "research run id (as used in research-run)"
        required: false
        default: "real3"

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SNAPSHOT_PASSPHRASE: ${{ secrets.SNAPSHOT_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12.15"
      - name: Install from the lock
        run: |
          python -m pip install --upgrade pip uv
          if [ ! -f uv.lock ]; then cp uv.lock.candidate uv.lock; fi
          uv sync --frozen --extra dev
      - name: Get and decrypt the opened run
        run: |
          test -n "$SNAPSHOT_PASSPHRASE" || { echo "::error::repository secret SNAPSHOT_PASSPHRASE is not set"; exit 1; }
          gh run download "${{ inputs.opened_run_id }}" -n "opened-${{ inputs.run_id }}" -D op
          mkdir -p outputs/runs
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SNAPSHOT_PASSPHRASE -in op/opened.tar.gz.enc | tar -xzf - -C outputs/runs
      - name: Verify the artifacts from the files alone (opened exactly once, pre-holdout state unchanged)
        run: uv run python tools/verify_artifacts.py "outputs/runs/${{ inputs.run_id }}"
      - name: Aggregate holdout figures
        run: uv run python tools/holdout_summary.py "outputs/runs/${{ inputs.run_id }}"
