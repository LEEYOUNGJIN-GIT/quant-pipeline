# Full-scale timing probe of the research lane on a SYNTHETIC snapshot (engineering evidence only, no provider data).
# Manual: measures the runner and how far the unreduced profile gets within a bounded number of checkpoints.
name: research-scale

on:
  workflow_dispatch:
    inputs:
      stop_after:
        description: "durable checkpoints to write before stopping (empty = run to completion)"
        required: false
        default: "60"
      start:
        description: "synthetic window start"
        required: false
        default: "2015-01-02"
      end:
        description: "synthetic window end"
        required: false
        default: "2024-12-31"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12.15"

      - name: Install from the lock
        run: |
          python -m pip install --upgrade pip uv
          if [ ! -f uv.lock ]; then cp uv.lock.candidate uv.lock; fi
          uv sync --frozen --extra dev

      - name: Runner facts
        run: |
          nproc
          free -g
          python --version

      - name: Probe
        run: |
          mkdir -p probe_out
          ARGS=""
          if [ -n "${{ inputs.stop_after }}" ]; then ARGS="--stop-after ${{ inputs.stop_after }}"; fi
          uv run python tools/scale_probe.py --work "$RUNNER_TEMP/scale" --start "${{ inputs.start }}" --end "${{ inputs.end }}" \
            $ARGS --json-out probe_out/scale_probe.json

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scale-probe
          path: probe_out/scale_probe.json
          if-no-files-found: warn
