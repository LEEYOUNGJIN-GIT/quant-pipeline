# Forward test: apply the FROZEN final selection of a finished run to dates after its data window, using a LONGER snapshot from research-data
# (run with end=2026-09-30). Nothing is selected and the sealed holdout of the finished run is neither opened nor evaluated; see tools/forward_test.py for
# the pre-registered interval and decision rule. Needs SNAPSHOT_PASSPHRASE only. The log carries aggregate statistics; the detail is an encrypted artifact.
name: research-forward-test

on:
  workflow_dispatch:
    inputs:
      new_data_run_id:
        description: "run id of the research-data workflow that collected the LONGER snapshot"
        required: false
        default: ""
      finished_run_id:
        description: "run id of the finished research-run workflow whose frozen selection is applied"
        required: false
        default: ""
      halt_diagnose_failed_run_id:
        description: "diagnosis instead of a forward test: run id of a halted research-run (uses old_data_run_id as its snapshot and run_id as its lineage name); aggregates only"
        required: false
        default: ""
      export_selection_branch:
        description: "instead of a forward test: copy the four fields of the finished run's final_selection.json (trial hash, parameters, frozen flags) to docs/frozen_selection/<run_id>/final_selection.json on this NEW branch of the public repository (finished_run_id and run_id name the run)"
        required: false
        default: ""
      decompose:
        description: "instead of a forward test: a descriptive decomposition (exposure, per-asset contribution, drawdown episode, decisions) of the same frozen path, using the committed docs/frozen_selection/<run_id>/final_selection.json; aggregates only (OQ-061)"
        type: boolean
        required: false
        default: false
      agent_view:
        description: "instead of a forward test: a descriptive agent-level view of the same frozen path (agent scores, gates, risk-pressure envelope, target before the optimiser against its weights), using the committed docs/frozen_selection/<run_id>/final_selection.json; aggregates only (OQ-062)"
        type: boolean
        required: false
        default: false
      old_data_run_id:
        description: "optional: run id of the research-data workflow of the finished run (to compare the overlapping years)"
        required: false
        default: ""
      run_id:
        description: "research run id of the finished run"
        required: false
        default: "real3"
      start:
        description: "first date of the forward interval (pre-registered default; change only with a written reason)"
        required: false
        default: "2025-04-23"

permissions:
  contents: read
  actions: read

jobs:
  forward:
    if: inputs.halt_diagnose_failed_run_id == '' && inputs.export_selection_branch == ''
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SNAPSHOT_PASSPHRASE: ${{ secrets.SNAPSHOT_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12.15"
      - name: Install from the lock
        run: |
          python -m pip install --upgrade pip uv
          if [ ! -f uv.lock ]; then cp uv.lock.candidate uv.lock; fi
          uv sync --frozen --extra dev
      - name: Get and decrypt the longer snapshot and the finished run
        run: |
          test -n "$SNAPSHOT_PASSPHRASE" || { echo "::error::repository secret SNAPSHOT_PASSPHRASE is not set"; exit 1; }
          gh run download "${{ inputs.new_data_run_id }}" -n research-snapshot -D dl_new
          mkdir -p data/snapshots/research outputs/finished
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SNAPSHOT_PASSPHRASE -in dl_new/snapshot.tar.gz.enc | tar -xzf - -C data/snapshots/research
          ID=$(ls data/snapshots/research | grep -E '^[0-9a-f]{64}$' | head -1)
          ln -sfn "$ID" data/snapshots/research/current
          echo "NEW_ID=$ID" >> "$GITHUB_ENV"
          if [ "${{ inputs.decompose }}" != "true" ] && [ "${{ inputs.agent_view }}" != "true" ]; then
            gh run download "${{ inputs.finished_run_id }}" -n "finished-${{ inputs.run_id }}" -D fin
            openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SNAPSHOT_PASSPHRASE -in fin/finished.tar.gz.enc | tar -xzf - -C outputs/finished
          fi
      - name: Compare the overlapping years with the snapshot the selection was made on (aggregates only)
        if: inputs.old_data_run_id != '' && !inputs.decompose && !inputs.agent_view
        run: |
          gh run download "${{ inputs.old_data_run_id }}" -n research-snapshot -D dl_old
          mkdir -p old
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SNAPSHOT_PASSPHRASE -in dl_old/snapshot.tar.gz.enc | tar -xzf - -C old
          OLD=$(ls old | grep -E '^[0-9a-f]{64}$' | head -1)
          uv run python tools/snapshot_prefix_diff.py --old "old/$OLD" --new "data/snapshots/research/$NEW_ID" --through 2024-12-31 --out prefix_diff.json
      - name: Largest one-day moves per series (aggregates and dates only; the control window ends before the sealed holdout starts)
        if: ${{ !inputs.decompose && !inputs.agent_view }}
        run: uv run python tools/price_jump_report.py --snapshot "data/snapshots/research/$NEW_ID" --from "${{ inputs.start }}" --out price_jumps.json
      - name: Run the forward test (frozen selection, no re-selection)
        if: ${{ !inputs.decompose && !inputs.agent_view }}
        run: |
          uv run python tools/forward_test.py --root . --finished-run "outputs/finished/${{ inputs.run_id }}" --out-root outputs/forward \
            --run-id forward --start "${{ inputs.start }}" --json-out forward_result.json
      - name: Decompose the frozen path (descriptive; aggregates only, nothing is selected or tuned)
        if: ${{ inputs.decompose }}
        run: |
          uv run python tools/forward_decompose.py --root . --selection-json "docs/frozen_selection/${{ inputs.run_id }}/final_selection.json" \
            --out-root outputs/forward --run-id decompose --start "${{ inputs.start }}" --json-out decomposition.json
      - name: Agent-level view of the frozen path (descriptive; aggregates only, nothing is selected or tuned)
        if: ${{ inputs.agent_view }}
        run: |
          uv run python tools/forward_agents.py --root . --selection-json "docs/frozen_selection/${{ inputs.run_id }}/final_selection.json" \
            --out-root outputs/forward --run-id agents --start "${{ inputs.start }}" --json-out agent_view.json
      - name: Encrypt the result
        if: always()
        run: |
          [ -n "$(ls forward_result.json prefix_diff.json price_jumps.json decomposition.json agent_view.json 2>/dev/null)" ] || exit 0
          tar -czf - $(ls forward_result.json prefix_diff.json price_jumps.json decomposition.json agent_view.json 2>/dev/null) | openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:SNAPSHOT_PASSPHRASE -out forward.tar.gz.enc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: forward-${{ inputs.run_id }}
          path: forward.tar.gz.enc
          retention-days: 90
          if-no-files-found: warn

  halt_diagnose:
    if: inputs.halt_diagnose_failed_run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SNAPSHOT_PASSPHRASE: ${{ secrets.SNAPSHOT_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12.15"
      - name: Install from the lock
        run: |
          python -m pip install --upgrade pip uv
          if [ ! -f uv.lock ]; then cp uv.lock.candidate uv.lock; fi
          uv sync --frozen --extra dev
      - name: Get and decrypt the snapshot and the run directory
        run: |
          test -n "$SNAPSHOT_PASSPHRASE" || { echo "::error::repository secret SNAPSHOT_PASSPHRASE is not set"; exit 1; }
          gh run download "${{ inputs.old_data_run_id }}" -n research-snapshot -D dl
          mkdir -p data/snapshots/research outputs/runs
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SNAPSHOT_PASSPHRASE -in dl/snapshot.tar.gz.enc | tar -xzf - -C data/snapshots/research
          ID=$(ls data/snapshots/research | grep -E '^[0-9a-f]{64}$' | head -1)
          ln -sfn "$ID" data/snapshots/research/current
          gh run download "${{ inputs.halt_diagnose_failed_run_id }}" -n "finished-${{ inputs.run_id }}" -D fin
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SNAPSHOT_PASSPHRASE -in fin/finished.tar.gz.enc | tar -xzf - -C outputs/runs
      - name: Re-run the finishing stage with the optimizer probe
        run: |
          uv run python tools/halt_diagnose.py --run-id "${{ inputs.run_id }}" --out-root outputs/runs --config configs/research_8_12asset.yaml 2>&1 | grep -v "^Model is not converging" | tail -n 120 || true

  export_selection:
    if: inputs.export_selection_branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      SNAPSHOT_PASSPHRASE: ${{ secrets.SNAPSHOT_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12.15"
      - name: Install from the lock
        run: |
          python -m pip install --upgrade pip uv
          if [ ! -f uv.lock ]; then cp uv.lock.candidate uv.lock; fi
          uv sync --frozen --extra dev
      - name: Decrypt the finished run and export the frozen selection (four fields only; nothing is printed except the file hash)
        run: |
          test -n "$SNAPSHOT_PASSPHRASE" || { echo "::error::repository secret SNAPSHOT_PASSPHRASE is not set"; exit 1; }
          mkdir -p outputs/finished "docs/frozen_selection/${{ inputs.run_id }}"
          gh run download "${{ inputs.finished_run_id }}" -n "finished-${{ inputs.run_id }}" -D fin
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SNAPSHOT_PASSPHRASE -in fin/finished.tar.gz.enc | tar -xzf - -C outputs/finished
          uv run python tools/forward_test.py --finished-run outputs/finished --out-root outputs/unused --export-selection "docs/frozen_selection/${{ inputs.run_id }}/final_selection.json"
          sha256sum "docs/frozen_selection/${{ inputs.run_id }}/final_selection.json"
      - name: Push the file to a new branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ inputs.export_selection_branch }}"
          git add "docs/frozen_selection/${{ inputs.run_id }}/final_selection.json"
          git commit -m "Frozen selection of run ${{ inputs.run_id }} (finished run ${{ inputs.finished_run_id }}); four fields of final_selection.json"
          git push origin "HEAD:refs/heads/${{ inputs.export_selection_branch }}"
