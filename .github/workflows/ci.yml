# Fixture CI (spec 20.2): frozen-lock setup, static doctor, plan, after-plan doctor, fixture run, verify.py.
# Action references are pinned to commit SHAs that were checked against the upstream repositories with `git ls-remote`:
#   actions/checkout v7.0.1, actions/setup-python v7.0.0, actions/upload-artifact v7.0.2 (lightweight tags: tag SHA == commit SHA).
# Until an accepted uv.lock is committed, uv.lock.candidate is installed as a LOCK CANDIDATE: the run is the target-runtime
# verification of spec 2.2, and verify.py reports the lock check as failing for the candidate by design.
name: fixture-ci

on:
  push:
    branches: [main, impl]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Bootstrap uv (networked bootstrap, version recorded)
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          { echo "python=$(python --version)"; echo "pip=$(python -m pip --version)"; echo "uv=$(uv --version)"; } | tee bootstrap_versions.txt

      - name: Select lock (accepted lock, or candidate)
        run: |
          if [ -f uv.lock ]; then
            echo "using the accepted uv.lock"
          else
            cp uv.lock.candidate uv.lock
            echo "QUANT_LOCK_CANDIDATE=1" >> "$GITHUB_ENV"
            echo "uv.lock.candidate installed as a lock candidate (not accepted)"
          fi

      - name: Sync environment from the lock
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check src tests tools

      - name: Static doctor
        run: uv run quant-pipeline doctor --config configs/fixture_3asset_aux1024.yaml

      - name: Plan
        run: uv run quant-pipeline plan --config configs/fixture_3asset_aux1024.yaml --run-id ci

      - name: After-plan doctor
        run: uv run quant-pipeline doctor --config configs/fixture_3asset_aux1024.yaml --after-plan --run-id ci

      - name: Fixture run
        run: uv run quant-pipeline run --config configs/fixture_3asset_aux1024.yaml --run-id ci

      - name: Capability probe
        if: always()
        run: uv run quant-pipeline probe

      - name: Verify (full test suite and check registry)
        if: always()
        run: uv run python tools/verify.py --run-id ci

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: verification-evidence
          path: |
            outputs/verify_report.json
            outputs/capability_probe.json
            outputs/doctor.static.json
            bootstrap_versions.txt
          if-no-files-found: warn
